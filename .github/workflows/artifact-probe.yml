name: artifact-probe
on: [push, workflow_dispatch]
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: create weird dirs and inspect glob behavior
        run: |
          set -eux
          B="$RUNNER_TEMP/art"
          mkdir -p "$B/..\\..\\commits\\1111111111111111111111111111111111111111"
          printf 'BBH-MARKER-UNIQUE-12345' > "$RUNNER_TEMP/marker.txt"
          tar -czf "$B/..\\..\\commits\\1111111111111111111111111111111111111111/next.tgz" -C "$RUNNER_TEMP" marker.txt
          mkdir -p "$B/..%2f..%2fcommits%2f2222222222222222222222222222222222222222"
          cp "$B/..\\..\\commits\\1111111111111111111111111111111111111111/next.tgz" "$B/..%2f..%2fcommits%2f2222222222222222222222222222222222222222/next.tgz"
          find "$B" -mindepth 1 -maxdepth 2 | cat -A | head -10
      - name: glob test (node)
        shell: bash
        run: |
          cat > /tmp/globtest.mjs <<'EOF'
          import * as glob from '/home/runner/work/_actions/actions/upload-artifact/v4/dist/index.js'
          EOF
          echo "skip"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-tarballs
          path: ${{ runner.temp }}/art/**
  consume:
    needs: make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preview-tarballs
          path: ${{ runner.temp }}/preview-tarballs
      - name: inspect
        run: |
          set -x
          find "$RUNNER_TEMP/preview-tarballs" | cat -A | head -20
          node -e '
            const fs=require("fs");
            const dir=process.env.RUNNER_TEMP+"/preview-tarballs";
            const walk=(d)=>{ for(const e of fs.readdirSync(d,{withFileTypes:true})){ const p=d+"/"+e.name; console.log("ENTRY:",JSON.stringify(e.name),"isDir:",e.isDirectory()); const u=new URL("https://vercel-packages.vercel.app/next/commits/AAAA/"+e.name); console.log("   URL path =>",u.pathname); if(e.isDirectory()) walk(p);} };
            walk(dir);'
