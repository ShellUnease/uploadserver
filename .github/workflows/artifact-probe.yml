name: artifact-probe
on: [push, workflow_dispatch]
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: create weird dirs
        run: |
          set -eux
          B="$RUNNER_TEMP/art"
          mkdir -p "$B/normal" "$B/..\\..\\commits\\1111111111111111111111111111111111111111"
          printf 'BBH-MARKER-UNIQUE-12345' > "$RUNNER_TEMP/marker.txt"
          for d in normal "..\\..\\commits\\1111111111111111111111111111111111111111"; do
            tar -czf "$B/$d/next.tgz" -C "$RUNNER_TEMP" marker.txt
          done
      - uses: actions/upload-artifact@v7
        with:
          name: preview-tarballs-placeholder
          path: ${{ runner.temp }}/art/normal
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-tarballs
          if-no-files-found: warn
          path: ${{ runner.temp }}/art
  consume:
    needs: make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preview-tarballs
          path: ${{ runner.temp }}/preview-tarballs
      - name: inspect
        run: |
          find "$RUNNER_TEMP/preview-tarballs" | cat -A | head -20
