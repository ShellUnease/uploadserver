name: artifact-probe
on: [push, workflow_dispatch]
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: create weird dirs
        run: |
          set -eux
          B="$RUNNER_TEMP/art"
          mkdir -p "$B/normal" "$B/..\\..\\commits\\1111111111111111111111111111111111111111" "$B/..%2f..%2fcommits%2f2222222222222222222222222222222222222222"
          printf 'BBH-MARKER-UNIQUE-12345' > "$RUNNER_TEMP/marker.txt"
          for d in normal "..\\..\\commits\\1111111111111111111111111111111111111111" "..%2f..%2fcommits%2f2222222222222222222222222222222222222222"; do
            tar -czf "$B/$d/next.tgz" -C "$RUNNER_TEMP" marker.txt
          done
      - name: glob library probe
        run: |
          npm init -y >/dev/null 2>&1
          npm i @actions/glob >/dev/null 2>&1
          cat > /tmp/g.mjs <<'EOF'
          import * as glob from '@actions/glob'
          const base = process.env.RUNNER_TEMP + '/art'
          for (const pat of [base+'/*', base+'/**', base+'/**/*.tgz']) {
            const g = await glob.create(pat)
            const r = await g.glob()
            console.log('PATTERN', pat)
            r.forEach(x => console.log('   MATCH', JSON.stringify(x)))
          }
          EOF
          node /tmp/g.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: preview-tarballs
          path: |
            /home/runner/work/_temp/art/normal/next.tgz
            /home/runner/work/_temp/art/..\..\commits\1111111111111111111111111111111111111111/next.tgz
            /home/runner/work/_temp/art/..%2f..%2fcommits%2f2222222222222222222222222222222222222222/next.tgz
  consume:
    needs: make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preview-tarballs
          path: ${{ runner.temp }}/preview-tarballs
      - name: inspect
        run: |
          find "$RUNNER_TEMP/preview-tarballs" | cat -A | head -20
